(()=>{'use strict';
const IMAGE=document.getElementById('homepage-art').src;
const catalog=[{id:1,name:'Little Scientist Kit',price:15,emoji:'🔬',category:'Learning',description:'Experiment and discover new things.'},{id:2,name:'Magical Art Studio',price:12,emoji:'🎨',category:'Creativity',description:'An imagination-powered art kit.'},{id:3,name:'Dinosaur Adventure Book',price:8,emoji:'🦕',category:'Learning',description:'A prehistoric reading adventure.'},{id:4,name:'Fairy Garden Starter',price:18,emoji:'🌱',category:'Learning',description:'Grow a miniature garden.'},{id:5,name:'Puzzle Quest',price:10,emoji:'🧩',category:'Learning',description:'A colorful puzzle challenge.'},{id:6,name:'Cuddly Star Friend',price:20,emoji:'🧸',category:'Treasure',description:'A soft and magical friend.'},{id:7,name:'Space Explorer Kit',price:25,emoji:'🚀',category:'Learning',description:'Explore the stars and planets.'},{id:8,name:'Wonderland Storybook',price:7,emoji:'📚',category:'Learning',description:'Discover a wonderful new story.'},{id:9,name:'Treasure Dig Kit',price:14,emoji:'💎',category:'Treasure',description:'Dig for sparkling gems.'},{id:10,name:'Make Your Own Jewelry',price:16,emoji:'📿',category:'Creativity',description:'Create your own handmade treasures.'},{id:11,name:'Outdoor Explorer Kit',price:23,emoji:'🔭',category:'Learning',description:'Explore bugs, plants and nature.'},{id:12,name:'Colorful Clay Set',price:9,emoji:'🌈',category:'Creativity',description:'Shape and sculpt your imagination.'}];
let state={screen:'home',category:'All',balance:250,saved:[],orders:[],budget:false,modal:null,parentDemo:false};
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function switchTo(s,category){state.screen=s;if(category)state.category=category;state.modal=null;render();window.scrollTo(0,0)}
function productCard(p){return `<article class="product"><div class="art">${p.emoji}<button class="favorite" data-save="${p.id}" aria-label="${state.saved.includes(p.id)?'Remove from':'Add to'} wishlist">${state.saved.includes(p.id)?'♥':'♡'}</button></div><div class="productBody"><small>${esc(p.category)}</small><h3>${esc(p.name)}</h3><div class="price">🪙 ${p.price} FB</div><button class="action block" data-choose="${p.id}">View treasure</button></div></article>`}
function nav(){return `<div class="tabnav"><button class="action ghost" data-go="shop">🏰 Shop</button><button class="action ghost" data-go="wallet">🪙 Wallet</button><button class="action ghost" data-go="wishlist">♡ Wishlist</button><button class="action ghost" data-go="orders">📦 Orders</button><button class="action ghost" data-go="parents">🔐 Parents</button></div>`}
function page(content,title){return `<div class="page"><header class="pageHeader"><button class="back" data-go="home">← Back</button><h1>${title}</h1><button class="navButton" data-go="wallet">🪙 ${state.balance} FB</button></header>${content}${nav()}<div class="copyright">Fairybucks.com ✨ A Little Magic, A Lot of Treasure</div></div>`}
function home(){return `<div class="home"><img src="${IMAGE}" alt="Fairybucks.com enchanted emerald and gold marketplace, with a richly detailed parchment scroll, balance panel, treasure categories and parent section." width="1024" height="1536"><button class="hotspot vault" data-go="shop" aria-label="Enter the Vault — open the fairy shop"></button><button class="hotspot wallet" data-go="wallet" aria-label="View Fairy Bucks wallet"></button><button class="hotspot learning" data-catgo="Learning" aria-label="Explore learning treasures"></button><button class="hotspot creativity" data-catgo="Creativity" aria-label="Explore creative treasures"></button><button class="hotspot treasure" data-catgo="Treasure" aria-label="Explore rewards"></button><button class="hotspot parents" data-go="parents" aria-label="Open the parent information area"></button></div>`}
function shop(){const shown=catalog.filter(p=>(state.category==='All'||state.category===p.category)&&(!state.budget||p.price<=15));return page(`<h2 class="sectionTitle">✧ Explore the Treasure Shop ✧</h2><p class="sub">Wonderful adventures, creative treasures, and discoveries await!</p><div class="chips">${['All','Learning','Creativity','Treasure'].map(c=>`<button class="chip ${state.category===c?'active':''}" data-category="${c}">${c==='All'?'✨ All':c==='Learning'?'📚 Learning':c==='Creativity'?'🎨 Creativity':'💎 Treasure'}</button>`).join('')}</div><div class="products">${shown.map(productCard).join('')}</div>${shown.length?'':'<div class="empty">No treasures in this category right now. Try another magical shelf!</div>'}`,'The Fairy Vault')}
function wallet(){return page(`<h2 class="sectionTitle">🪙 My Fairy Wallet</h2><p class="sub">Save your Fairy Bucks for an extra special treasure!</p><div class="panel"><p class="muted" style="text-align:center">YOUR FAIRY BUCKS BALANCE</p><div class="balance">${state.balance} FB</div><p style="text-align:center">A little magic to save, a world of treasures to discover.</p></div><div class="panel"><h2>✨ Little coins, big possibilities</h2><p>Choose something small today, or keep saving for a bigger treasure.</p><button class="action block" data-go="shop">Explore the shop →</button></div>`,'My Fairy Wallet')}
function wishlist(){const items=catalog.filter(p=>state.saved.includes(p.id));return page(`<h2 class="sectionTitle">♡ My Magical Wishlist</h2><p class="sub">Your favorite dreams and discoveries, all in one place.</p>${items.length?`<div class="products">${items.map(productCard).join('')}</div>`:'<div class="empty"><span>💗</span>Save favorite treasures with the heart on each card.<p><button class="action" data-go="shop">Explore treasures</button></p></div>'}`,'Magical Wishlist')}
function orders(){return page(`<h2 class="sectionTitle">📦 Fairy Delivery Requests</h2><p class="sub">Your fairy helpers are reviewing your magical treasure requests.</p><div class="panel">${state.orders.length?state.orders.map((o,i)=>`<div class="setting"><div>${o.emoji} <strong>${esc(o.name)}</strong><div class="muted">${o.price} FB • Awaiting fairy approval</div></div><button class="action ghost" data-remove="${i}">Cancel</button></div>`).join(''):'<div class="empty"><span>📦</span>No magical requests yet.</div>'}</div>`,'My Orders')}
function parents(){return page(`<h2 class="sectionTitle">🔐 Parent Fairy Headquarters</h2><p class="sub">The magic behind the magic.</p>${!state.parentDemo?`<div class="panel"><h2>Grown-ups only</h2><p>The real Fairy Bucks website will use secure parent login. This preview has a non-secure demonstration of the parent controls.</p><button class="action block" data-demo="1">Open parent demo</button></div>`:`<div class="notice">Demo only: This is not secure parent authentication. No real payments or Amazon purchases are connected.</div><div class="panel"><h2>Manage Fairy Bucks</h2><div class="setting"><strong>Current demo balance</strong><strong class="coins">${state.balance} FB</strong></div><label for="award">Award Fairy Bucks</label><div class="row" style="margin-top:10px"><input id="award" class="field" type="number" min="1" max="1000" value="5" style="max-width:125px"><button class="action" data-award="1">Award</button></div></div><div class="panel"><h2>Shop preferences</h2><div class="setting"><div><strong>Universal exchange rate</strong><div class="muted">The same for every family</div></div><strong>1 FB = $1</strong></div><div class="setting"><div><strong>Limit visible products</strong><div class="muted">Hide items above 15 FB in this demo</div></div><button class="action ghost" data-budget="1">${state.budget?'ON':'OFF'}</button></div></div><div class="panel"><h2>Treasure requests</h2>${state.orders.length?state.orders.map((o,i)=>`<div class="setting"><div>${o.emoji} ${esc(o.name)}<div class="muted">${o.price} FB</div></div><button class="action" data-approve="${i}">Approve</button></div>`).join(''):'<p class="muted">No pending requests.</p>'}<p class="muted">Approving here deducts demo Fairy Bucks but does not place a real order.</p></div>`}`,'For Parents')}
function modal(){if(!state.modal)return '';const p=catalog.find(v=>v.id===state.modal);return `<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(p.name)}"><div class="dialog"><div class="big">${p.emoji}</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><h2 class="coins">🪙 ${p.price} Fairy Bucks</h2><p>${p.price<=state.balance?'Send a magical request for parent approval.':'You need '+(p.price-state.balance)+' more Fairy Bucks, but you may still save it to your wishlist.'}</p><button class="action block" data-request="${p.id}">✨ ${p.price<=state.balance?'Request this treasure':'Add to wishlist'}</button><button class="action ghost block" style="margin-top:9px" data-close="1">Maybe later</button></div></div>`}
function render(){app.innerHTML=state.screen==='home'?home():state.screen==='shop'?shop():state.screen==='wallet'?wallet():state.screen==='wishlist'?wishlist():state.screen==='orders'?orders():parents();if(state.modal)app.insertAdjacentHTML('beforeend',modal())}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go){switchTo(d.go);return}if(d.catgo){switchTo('shop',d.catgo);return}if(d.category){state.category=d.category;render();return}if(d.save){let id=Number(d.save);state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render();return}if(d.choose){state.modal=Number(d.choose);render();return}if(d.close){state.modal=null;render();return}if(d.request){let p=catalog.find(x=>x.id===Number(d.request));if(p.price>state.balance){if(!state.saved.includes(p.id))state.saved.push(p.id);switchTo('wishlist')}else{state.orders.push(p);switchTo('orders')}return}if(d.remove!==undefined){state.orders.splice(Number(d.remove),1);render();return}if(d.demo){state.parentDemo=true;render();return}if(d.award){const n=Number(document.getElementById('award').value);if(Number.isInteger(n)&&n>=1&&n<=1000)state.balance+=n;render();return}if(d.budget){state.budget=!state.budget;render();return}if(d.approve!==undefined){let p=state.orders[Number(d.approve)];if(p&&p.price<=state.balance){state.balance-=p.price;state.orders.splice(Number(d.approve),1)}render();return}});
render();
})();</script></body></html>
