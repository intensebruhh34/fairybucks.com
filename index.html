function switchTo(s,category){if(['wallet','wishlist','orders'].includes(s)&&!state.loggedIn){state.nextScreen=s;state.screen='login'}else{state.screen=s}if(category)state.category=category;state.modal=null;render();window.scrollTo(0,0)}
function productCard(p){return `<article class="product"><div class="art">${p.emoji}<button class="favorite" data-save="${p.id}" aria-label="${state.saved.includes(p.id)?'Remove from':'Add to'} wishlist">${state.saved.includes(p.id)?'♥':'♡'}</button></div><div class="productBody"><small>${esc(p.category)}</small><h3>${esc(p.name)}</h3><div class="price">🪙 ${p.price} FB</div><button class="action block" data-choose="${p.id}">View treasure</button></div></article>`}
function nav(){return `<div class="tabnav"><button class="action ghost" data-go="shop">🏰 Shop</button><button class="action ghost" data-go="wallet">🪙 Wallet</button><button class="action ghost" data-go="wishlist">♡ Wishlist</button><button class="action ghost" data-go="orders">📦 Orders</button><button class="action ghost" data-go="parents">🔐 Parents</button></div>`}
function page(content,title){return `<div class="page"><header class="pageHeader"><button class="back" data-go="home">← Back</button><h1>${title}</h1><button class="navButton" data-go="${state.loggedIn?'wallet':'login'}">${state.loggedIn?'🪙 '+state.balance+' FB':'✨ Log In'}</button></header>${content}${nav()}<div class="copyright">Fairybucks.com ✨ A Little Magic, A Lot of Treasure</div></div>`}
function home(){return `<div class="home"><img src="${IMAGE}" alt="Fairybucks.com enchanted emerald and gold marketplace, with parchment scroll, fairy account doorway, treasure categories and parent section." width="1024" height="1536"><button class="hotspot vault" data-go="shop" aria-label="Enter the Vault — open the fairy shop"></button><button class="accountArt" data-go="${state.loggedIn?'wallet':'login'}" aria-label="Access your Fairy Buck account"></button><button class="hotspot learning" data-catgo="Learning" aria-label="Explore learning treasures"></button><button class="hotspot creativity" data-catgo="Creativity" aria-label="Explore creative treasures"></button><button class="hotspot treasure" data-catgo="Treasure" aria-label="Explore rewards"></button><button class="hotspot parents" data-go="parents" aria-label="Open the parent information area"></button></div>`}
function shop(){const shown=catalog.filter(p=>(state.category==='All'||state.category===p.category)&&(!state.budget||p.price<=15));return page(`<h2 class="sectionTitle">✧ Explore the Treasure Shop ✧</h2><p class="sub">Wonderful adventures, creative treasures, and discoveries await!</p><div class="chips">${['All','Learning','Creativity','Treasure'].map(c=>`<button class="chip ${state.category===c?'active':''}" data-category="${c}">${c==='All'?'✨ All':c==='Learning'?'📚 Learning':c==='Creativity'?'🎨 Creativity':'💎 Treasure'}</button>`).join('')}</div><div class="products">${shown.map(productCard).join('')}</div>${shown.length?'':'<div class="empty">No treasures in this category right now. Try another magical shelf!</div>'}`,'The Fairy Vault')}
function login(){return page(`<div class="loginCard"><div class="fairy" aria-hidden="true">🧚🏻‍♀️</div><h2>Welcome to Your Fairy Buck Account</h2><p>A secret little doorway to your fairy treasures!</p><button class="action block" data-login-demo="1">✨ Enter My Demo Fairy Account</button><p class="demoNote">Preview only: no account is created, no password is collected, and nothing is saved. Ask a grown-up before using a real account.</p></div>`,'Fairy Account Login')}
function wallet(){return page(`<h2 class="sectionTitle">🪙 My Fairy Wallet</h2><p class="sub">Save your Fairy Bucks for an extra special treasure!</p><div class="panel"><p class="muted" style="text-align:center">YOUR FAIRY BUCKS BALANCE</p><div class="balance">${state.balance} FB</div><p style="text-align:center">A little magic to save, a world of treasures to discover.</p></div><div class="panel"><h2>✨ Little coins, big possibilities</h2><p>Choose something small today, or keep saving for a bigger treasure.</p><button class="action block" data-go="shop">Explore the shop →</button></div>`,'My Fairy Wallet')}
function wishlist(){const items=catalog.filter(p=>state.saved.includes(p.id));return page(`<h2 class="sectionTitle">♡ My Magical Wishlist</h2><p class="sub">Your favorite dreams and discoveries, all in one place.</p>${items.length?`<div class="products">${items.map(productCard).join('')}</div>`:'<div class="empty"><span>💗</span>Save favorite treasures with the heart on each card.<p><button class="action" data-go="shop">Explore treasures</button></p></div>'}`,'Magical Wishlist')}
function orders(){return page(`<h2 class="sectionTitle">📦 Fairy Delivery Requests</h2><p class="sub">Your fairy helpers are reviewing your magical treasure requests.</p><div class="panel">${state.orders.length?state.orders.map((o,i)=>`<div class="setting"><div>${o.emoji} <strong>${esc(o.name)}</strong><div class="muted">${o.price} FB • Awaiting fairy approval</div></div><button class="action ghost" data-remove="${i}">Cancel</button></div>`).join(''):'<div class="empty"><span>📦</span>No magical requests yet.</div>'}</div>`,'My Orders')}
function parents(){return page(`<h2 class="sectionTitle">✨ For Grown-Ups</h2><p class="sub">Fairybucks invites little explorers into a world of imagination and discovery.</p><div class="panel"><h2>Parent Headquarters is being prepared</h2><p>A secure parent area will eventually manage child profiles, approval requests, and privately held settings.</p><p class="notice">This preview has no real accounts, no secure login, and no saved orders. Real parent-only financial information will only be available after verified parent authentication is implemented.</p></div>`,'For Parents')}
function modal(){if(!state.modal)return '';const p=catalog.find(v=>v.id===state.modal);return `<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(p.name)}"><div class="dialog"><div class="big">${p.emoji}</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><h2 class="coins">🪙 ${p.price} Fairy Bucks</h2><p>${p.price<=state.balance?'Send a magical treasure request to your fairy helpers.':'You need '+(p.price-state.balance)+' more Fairy Bucks, but you may still save it to your wishlist.'}</p><button class="action block" data-request="${p.id}">✨ ${p.price<=state.balance?'Request this treasure':'Add to wishlist'}</button><button class="action ghost block" style="margin-top:9px" data-close="1">Maybe later</button></div></div>`}
function render(){app.innerHTML=state.screen==='home'?home():state.screen==='shop'?shop():state.screen==='login'?login():state.screen==='wallet'?wallet():state.screen==='wishlist'?wishlist():state.screen==='orders'?orders():parents();if(state.modal)app.insertAdjacentHTML('beforeend',modal())}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go){switchTo(d.go);return}if(d.loginDemo){state.loggedIn=true;switchTo(state.nextScreen||'wallet');return}if(d.catgo){switchTo('shop',d.catgo);return}if(d.category){state.category=d.category;render();return}if(d.save){if(!state.loggedIn){state.nextScreen='wishlist';switchTo('login');return}let id=Number(d.save);state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render();return}if(d.choose){state.modal=Number(d.choose);render();return}if(d.close){state.modal=null;render();return}if(d.request){if(!state.loggedIn){state.nextScreen='shop';switchTo('login');return}let p=catalog.find(x=>x.id===Number(d.request));if(p.price>state.balance){if(!state.saved.includes(p.id))state.saved.push(p.id);switchTo('wishlist')}else{state.orders.push(p);switchTo('orders')}return}if(d.remove!==undefined){state.orders.splice(Number(d.remove),1);render();return}if(d.demo){state.parentDemo=true;render();return}if(d.award){const n=Number(document.getElementById('award').value);if(Number.isInteger(n)&&n>=1&&n<=1000)state.balance+=n;render();return}if(d.budget){state.budget=!state.budget;render();return}if(d.approve!==undefined){let p=state.orders[Number(d.approve)];if(p&&p.price<=state.balance){state.balance-=p.price;state.orders.splice(Number(d.approve),1)}render();return}});
render();
})();</script></body></html>
